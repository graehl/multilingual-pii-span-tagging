    known_positive_whole_extent: [family_name]
    known_negative: [given_name, middle_name, name_prefix]
    unknown_unless_source_structure_supplies_extents:
      [person_name, clinician_name, patient_name, relative_name]
  care_provider:
    known_positive_whole_extent: [clinician_name]
    known_negative: [patient_name, relative_name]
    unknown_unless_source_structure_supplies_role:
      [person_name, given_name, family_name, middle_name, name_prefix]

# Qualified-gold source labels that v1 onboarding intentionally ignored, or (for
# multigrascco) that the v1 mapping never declared at all. These are a SEPARATE
# declared surface: `sources` above still has to match the v1 tagset's schema and
# label inventory exactly, and nothing here relaxes that check.
#
# Every entry is fail-closed. The schema must already exist in v1; the label must
# NOT exist in that schema's v1 mapping; a manifest-backed label must appear in
# the tracked onboarding manifest's ignored_source_labels with a matching
# source_schema; a raw-scan label must be listed as undeclared by the tracked,
# text-redacted evidence artifact, be present in that scan's observed inventory,
# and be absent from the v1 mapping. That is what separates a genuinely new v2
# source label from a typo or from silent drift.
#
# The declared label set must EQUAL the recovered set, not merely sit inside it,
# so deleting an entry cannot quietly return a recovered qualified-gold label to
# being silently dropped. Every declared manifest/evidence path must be a
# repository-relative path that resolves inside this repository and outside the
# private tasks/ tree; absolute paths and `..` escapes are rejected.
#
# `promotion` is deliberately conservative in this contract: every recovered
# label is `withheld` (or `evaluation_only`) even where its mapping is
# deterministic, so declaring a label can never by itself put it into training.
source_extensions:
  hiner_original:
    provenance:
      kind: onboarding_manifest
      dataset: hiner
      manifest: data/pii-onboarded/hiner/manifest.json
    labels:

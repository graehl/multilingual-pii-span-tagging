# Acceptable-set construction, for review and for regeneration:
#   acceptable(node) = {functional projection}
#                     u {final images of the node's forest descendants}
#                     u {curated indeterminacy links}
# Ancestor images are deliberately NOT added. Source labels inherit their
# node's set except where source_overrides adjusts it.
#
# The loader recomputes all of this from scripts/pii_tagset.yaml and fails on
# any difference, so only genuinely curated links appear here: a link whose
# targets are already implied by the node's own projection and its descendants
# is rejected as redundant, because a redundant link would silently keep a
# stale set alive after a projection changes.
#
# A source_overrides entry may adjust `acceptable`, `fallback`, or both, but
# only for the one named source cell. Whichever half is omitted keeps its
# canonical value, so a corpus whose only defect is the default answer does not
# have to restate a set it did not change. Shared v1 canonical-node fallbacks are
# never edited to repair a single source: the qualified-gold audit found four
# cells whose v1 node projection is wrong *for that corpus only*, and moving the
# node would silently move every other schema that shares it.
acceptable_set_construction:
  rule: functional_projection_plus_descendant_images_plus_curated_links
  ancestor_images_added: false
  curated_links_must_be_effective: true
  source_overrides_must_be_effective: true
  curated_links:
    misc_identifier: [bank_account_number, device_identifier, government_id, ip_address,
      payment_card_data, record_identifier, username]
    org_issued_id: [government_id, record_identifier]
    quantity: [age, monetary_amount, postal_code, quantity]
    name_prefix: [person_name, O]
    currency_designator: [monetary_amount, O]
  explicit_money_labels: [monetary_amount, salary, MONEY]
  source_overrides:
    - schema: authored_v1
      label: order_number
      acceptable: [record_identifier]
      reason: >-
        an order number is an issued record identifier, not a candidate for the other misc targets
    - schema: authored_v1
      label: reservation_number
      acceptable: [record_identifier]
      reason: >-
        a reservation number is an issued record identifier
    - schema: multigrascco
      label: ID
      acceptable: [record_identifier]
      reason: >-
        MultiGraSCCo ID is an organization-issued record identifier, never a government ID
    - schema: presidio_fork_2_2_364_multilingual
      label: ID
      acceptable: [device_identifier, government_id, record_identifier, username]
      reason: >-
        the fork's generic ID recognizer fires on alphanumeric identifiers of any issuer
        (record, government, device, account handle); IP addresses have their own recognizer
    - schema: openai_8
      label: account_number
      acceptable: [bank_account_number, government_id, payment_card_data, record_identifier]
      reason: >-
        OpenAI's published example labels a project-file reference as account_number
        (https://openai.com/index/introducing-openai-privacy-filter/). Preserve record-ID
        credit alongside financial accounts; permissive comparison also admits authority
        account identifiers. Bare currency, amounts, organizations and routing codes remain
        excluded. This source-specific allowance does not broaden the canonical account_number.
    - schema: spy_7
      label: ID_NUM
      acceptable: [bank_account_number, government_id, payment_card_data, record_identifier]
      reason: >-
        the SPY generic ID_NUM pool mixes authority-issued, organization-record, financial-account
        and payment-card identifiers
    - schema: fastino_42
      label: payment_card
      fallback: payment_card_data
      acceptable: [payment_card_data]
      reason: >-
        The GLiNER2-PII tagset describes payment_card as the broad banking/payment
        category over card-number and CVV subtypes (https://arxiv.org/html/2605.09973v1).
        It does not define card brands or issuers as payment_card values. A brand
        such as Mastercard therefore receives no organization credit through this label.
    - schema: openmed_54
      label: CREDITCARDISSUER
      acceptable: [organization]
      reason: >-
        the source label explicitly identifies a named card issuer or network, never card account
        data such as the primary account number, security code, or expiry
    - schema: ai4privacy_200k
      label: CREDITCARDISSUER
      acceptable: [organization]
      reason: >-
        the source label explicitly identifies a named card issuer or network, never card account
        data such as the primary account number, security code, or expiry
    - schema: tab_8
      label: QUANTITY
      acceptable: [monetary_amount, quantity]
      reason: >-
        a generic amount label stays ambiguous between non-currency quantity and money
    - schema: mapa_coarse
      label: AMOUNT
      acceptable: [monetary_amount, quantity]
      reason: >-
        a generic amount label stays ambiguous between non-currency quantity and money
    - schema: tab_8
      label: CODE
      acceptable: [government_id, phone_number, record_identifier]
      reason: >-
        the TAB annotation guideline defines CODE as numbers and codes that identify something and
        names SSNs, phone numbers, passport numbers and licence plates alongside report
        identifiers; the observed distribution is dominated by court application numbers, so the
        record_identifier fallback stands, but the singleton set forbade the guideline's own
        authority-issued and contact-channel minority
    - schema: tab_8
      label: MISC
      fallback: O
      acceptable: [O, demographic_attribute, health_condition, location, organization,
        protected_attribute, record_identifier]
      reason: >-
        TAB MISC is the guideline's descriptive residue - "every other type of information that
        describes an individual" - not an identifier bucket; observed spans are medications,
        welfare-programme names, case citations, named laws, settlement kinds and health or
        sexual-orientation descriptions, and the inherited misc_identifier projection could not
        express any of them; O is the honest default for an unrestricted residue
    - schema: tab_8
      label: DATETIME
      acceptable: [O, date, date_of_birth, time]
      reason: >-
        the TAB guideline puts durations ("18 years") in DATETIME alongside dates and clock times;
        a duration is outside this ontology, so O must be reachable, but only through source
        structure or independent review - never as a lexical guess
    - schema: meddocan_phi
      label: FAMILIARES_SUJETO_ASISTENCIA
      fallback: demographic_attribute
      acceptable: [age, demographic_attribute, person_name]
      reason: >-
        the label marks the relative, and its observed surfaces are overwhelmingly kinship terms
        and ages rather than names; the inherited relative_name projection made person_name the
        default for a label whose modal content is a kinship word, contradicting the identical
        MultiGraSCCo FAMILY treatment
    - schema: meddocan_phi
      label: TERRITORIO
      fallback: locality
      acceptable: [admin_area, locality, postal_code]
      reason: >-
        TERRITORIO is a union of settlement names, sub-national areas and bare postal codes with no
        observed facility or street instances, so the broad location backoff was both too wide and
        wrong at its default
    - schema: multigrascco
      label: HEALTH_FCLT
      fallback: demographic_attribute
      acceptable: [O, demographic_attribute, health_condition]
      reason: >-
        despite the name, the observed spans are care-setting and care-episode descriptors rather
        than facility names; actual hospital names carry LOCATION_HOSPITAL, so the organization
        projection typed a descriptive attribute as a named organization
    - schema: multigrascco
      label: DIRECT_ID_ADDRESS
      fallback: demographic_attribute
      acceptable: [O, demographic_attribute, location, organization]
      reason: >-
        the observed spans are living-arrangement clauses rather than postal addresses; the
        street_address projection typed a housing-situation attribute as a mailing address


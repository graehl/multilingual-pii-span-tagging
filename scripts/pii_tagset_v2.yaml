# Composition contracts. These record what source STRUCTURE licenses a boundary
# transform. They are declarations for the future relabeler, which this module
# does not implement; no lexical guess may stand in for the structure named here.
composition_contracts:
  multigrascco_name_title:
    schema: multigrascco
    label: NAME_TITLE
    contract: attached_title_joins_person_name_standalone_title_is_outside
    requires: adjacency_in_source_structure
    without_structure: independent_review
    creates_new_primary_or_predicate: false
    note: >-
      the source annotates honorifics and academic degrees as their own spans and mixes attached
      forms with standalone ones; an attached title belongs inside one person_name span, a
      standalone title is O, and the acceptable set alone cannot express the difference because
      choosing between person_name and O is not the same operation as absorbing a span
  wojood_nested_amount_components:
    schema: wojood_nested
    labels: [CURR, UNIT]
    contract: contained_component_absorbs_into_enclosing_amount
    requires: source_nesting_layer
    without_structure: outside
    creates_new_primary_or_predicate: false
    note: >-
      the audited nesting layer shows the currency designator occurring inside an enclosing MONEY
      span in most of its occurrences; this is the same convention TAB states in prose and MAPA
      encodes as a fine UNIT inside a coarse AMOUNT
  mapa_fine_person_components:
    schema: mapa_coarse
    coarse_label: PERSON
    contract: fine_family_name_supplies_family_name_character_extents
    requires: fine_layer_containment_in_coarse_span
    without_structure: unknown_attribute_key
    creates_new_primary_or_predicate: false
    fine_title_and_role_stay_inside_person_span: true
    admit_fine_layer_only_siblings_wholesale: false
    note: >-
      fine FAMILY NAME spans contained in a coarse PERSON span give exact family_name character
      extents, and fine TITLE/ROLE containment is direct gold evidence that honorifics and
      occupational roles sit inside the person span; fine UNIT inside a coarse AMOUNT is
      structured evidence for the money/non-money split but is not by itself a deterministic
      decision, and fine-layer-only siblings are not admitted wholesale
    provenance_warning: >-
      MAPA's 21 language renderings are parallel realizations of 12 base documents, so language
      count is not independent support; documents 205541 and 205542 straddle split boundaries and
      carry a sentence-level leakage risk that any later promotion must handle

# Source-side metadata channels. These are provenance, not ontology truth: they
# never become a primary class or a predicate channel. A channel may act as a
# deterministic type discriminator only where the source's own semantic type is
# descriptive rather than referential, and only into that label's declared
# acceptable set.
source_metadata_channels:
  tab_8:
    confidential_status:
      kind: special_category_provenance
      values: [BELIEF, ETHNIC, HEALTH, NOT_CONFIDENTIAL, POLITICS, SEX]
      creates_predicate_channel: false
      deterministic_discriminator:
        DEM:
          HEALTH: health_condition
          ETHNIC: protected_attribute
          POLITICS: protected_attribute
          BELIEF: protected_attribute
          SEX: protected_attribute
      note: >-
        the channel is orthogonal to the semantic type and a name, a date or a court code can all
        carry it, so it is recorded as provenance rather than adopted as a third predicate; it is
        used as a deterministic discriminator only on DEM, whose annotated content is a
        description of a person rather than a reference to one
    identifier_type:
      kind: masking_risk_provenance
      values: [DIRECT, NO_MASK, QUASI]
      creates_predicate_channel: false
      note: >-
        most annotated TAB entities are NO_MASK, so the corpus's own risk judgement disagrees with
        treating every annotated span as material to redact; this is recorded so later promotion
        can weigh it, and it does not change any type

# Scoring and warm-init metadata. This checkpoint only records and validates
# it; no scorer or initializer here consumes it yet.
compatibility_scoring:
  primary_matching: [exact, symmetric_80pct_overlap]
  overlap_criterion: >-
    A predicted and a gold span match under symmetric 80% overlap iff the intersection covers at
    least 0.8 of the predicted span and at least 0.8 of the gold span; the criterion is symmetric
    so neither side is rewarded for being longer.
  assignment: maximum_cardinality_one_to_one
  assignment_note: >-
    Exact matches and overlap matches are resolved together as one maximum-cardinality one-to-one
    assignment, not by greedy first-come pairing.
  compatibility_relation_kinds: [functional, hierarchy, indeterminacy, bucket]
  compatibility_relation_semantics:
    functional: a v1 node maps to exactly one v2 class
    hierarchy: a v1 node is coarser than the v2 classes covering it
    indeterminacy: the v1 label genuinely spans several v2 classes and cannot be resolved by name
    bucket: a v1 catch-all label whose members are distributed across unrelated v2 classes
  compatibility_relation_scope: cross_generation_and_external_comparison_only
  permanent_v2_gold_scoring_uses_compatibility: false

warm_init:
  one_to_one_rows: copy
  merged_rows: mass_weighted
  merged_rows_formula: >-
    w_new = sum_i (support_i / sum_j support_j) * w_i over the contributing v1 BIOES rows, so a
    merged row is the support-mass-weighted mean of its contributors.
  merged_bias: contributor_log_sum_exp
  merged_bias_formula: b_new = logsumexp(b_1, ..., b_n)
  merged_bias_rationale: >-
    The merged class fires when any contributor would, so its prior is the combined prior. Bias is
    logsumexp of the contributor biases, not their average.
  outside_row: copy
  split_rows: duplicate_with_symmetry_breaking
  symmetry_breaking: deliberate_for_future_splits
  symmetry_breaking_rationale: >-
    Identical duplicated rows would stay tied under identical gradients, so a split's copies are
    perturbed on purpose.
  new_predicate_heads: initialized_separately
  matched_control: same_v11_encoder_with_fresh_or_refitted_v2_head
  checkpoints: [250, 500, 1000, 1500]
  encoder_schedule: frozen_for_initial_head_fit_then_unfrozen
  adoption_criterion: better_at_early_checkpoints_and_no_worse_at_the_matched_final_rung
  matched_pilot:
    must_match: [data, order, optimizer, schedule, budget, seeds]
    first_stage: fit_new_head_with_encoder_frozen
    adopt_warm_init_only_if_matched_pilot_supports_it: true

# Frozen source-span remap admission rule for the later relabeler.
remap_admission:
  version: pii-ontology-v2-remap-admission-v1
  span_geometry: fixed_source_span
  token_inclusion: every_nonempty_offset_token_overlapping_the_span
  candidate_strength: mean_over_included_tokens_of_max_bioes_column_logit
  strength_columns: [B, I, E, S]
  outside_strength: mean_over_included_tokens_of_the_O_logit
  logits: raw
  argmax_restricted_to: declared_acceptable_set
  margin: winner_strength_minus_runner_up_strength
  margin_units: mean_logit
  margin_threshold_nats: 1.0986122886681098
  margin_threshold_expression: ln(3)
  margin_required_to_change_away_from_fallback: true
  fallback_winner_requires_margin: false
  singleton_acceptable_set: deterministic_not_model_supported
  ties: retain_fallback
  record_fields:
    [winner, runner_up, winner_strength, runner_up_strength, margin, threshold,
     fallback, model_identity, model_revision, cache_identity, token_offsets,
     route_provenance]
  status: proposal_only
  training_promotion_requires: declared_source_blind_route_review
  evaluation_promotion_requires: independent_review
  evaluation_promotion_automatic: false

# PII target ontology v2: the adopted primary inventory, its v1
# compatibility projection, the adopted attribute channels, and the frozen
# methodology metadata for training, scoring, warm init, and source remapping.
#
# scripts/pii_tagset.yaml (version 1) stays immutable: it remains the
# compatibility control and the authority for which source labels exist.
# Loader/validator: scripts/pii_ontology_v2.py. Record schema:
# scripts/pii_gold_v2.schema.json.
#
# primary: the 29 BIOES primary classes. Each class carries the proposal's
#   family, default redaction action, admission prongs, and definition.
# attr_channels: independent sigmoid predicate channels over character
#   extents inside a primary span; they are not BIOES classes.
# old_v1 / sources: fixed-span retyping candidates. `fallback` is the
#   declared projection used unless the frozen admission rule below admits a
#   different member of `acceptable`. O is a sentinel target, not a class.

version: 2
ontology_version: pii-ontology-v2
schema_version: pii-gold-v2
projection_version: pii-v1-to-v2-projection-v2
span_encoding: BIOES
outside_label: O

compatibility_tagset:
  path: scripts/pii_tagset.yaml
  version: 1
  status: immutable_compatibility_control

gold_schema:
  path: scripts/pii_gold_v2.schema.json

# The proposal artifact admitted 28 classes because it merged money into
# `quantity`. The adopted Q6 decision separates `monetary_amount` from a
# now non-currency `quantity`, so the adopted inventory is 29. Everything
# else in `primary` is the proposal's own family/action/prong/definition text.
adoption_note:
  proposal: untracked/pii-eval/analysis/ontology-v2-proposal-v1
  proposal_class_count: 28
  adopted_class_count: 29
  difference: q6_separates_monetary_amount_from_quantity
  proposal_merged_money_into_quantity: true
  q6_currency_designator_alone: O

families:
  attribute: Personal attributes and quasi-identifiers.
  authority_id: Identifiers an authority issues to a person or their entitlement.
  contact: Reachability channels for a person or organization.
  credential: Authentication and authorization secrets.
  date_time: Absolute dates and clock times.
  digital: Device, client, and account handles in digital systems.
  financial: Financial instruments, institution routing, and monetary amounts.
  location: Places and address components.
  org_id: Identifiers an organization or system issues for its own records.
  organization: Named organizations.
  other: Classes that belong to no other family.
  person: Personal-name entities.

# The proposal's five bulk redaction actions, verbatim.
actions:
  SUPPRESS: delete the span, emit no surrogate (a plausible fake would itself be a hazard)
  PSEUDONYM: replace with a consistent, type-plausible surrogate; the same surface gets the same surrogate across a document set
  MASK: format-preserving character mask; retain a tail only when the value is long enough that the tail is not the whole secret
  GENERALIZE: replace with a coarser value from a documented ladder (date->year, age->band, locality->admin area, coordinates->rounded cell)
  KEEP: retain verbatim; flag for audit only

# Admission-test prongs each class passed: R retrieval-gating, A
# bulk-action-gating, S support/learnability.
admission_prongs:
  R: the class gates targeted retrieval of a person
  A: the class gates a distinct bulk redaction action
  S: the class has enough post-split support to learn

primary:
  admin_area:
    family: location
    action: KEEP
    prongs: [A]
    definition: >-
      An administrative area at or above state level: state, province, prefecture, region,
      country, and the time zone standing for one.
  age:
    family: attribute
    action: GENERALIZE
    prongs: [A]
    definition: >-
      A stated age or age phrase of a person.
  bank_account_number:
    family: financial
    action: MASK
    prongs: [A]
    definition: >-
      An identifier that addresses a value store: bank account number, IBAN, BBAN, already-masked
      account digits, and cryptocurrency wallet address.
  bank_routing_code:
    family: financial
    action: KEEP
    prongs: [A]
    definition: >-
      A code identifying a financial institution or branch: SWIFT/BIC, ABA routing number, sort
      code.
  credential:
    family: credential
    action: SUPPRESS
    prongs: [A]
    definition: >-
      A secret that authenticates: password, PIN, API key, access or session token, cookie value,
      recovery code.
  date:
    family: date_time
    action: GENERALIZE
    prongs: [A]
    definition: >-
      A calendar date, with or without a time component, in any locale convention.
  date_of_birth:
    family: date_time
    action: GENERALIZE
    prongs: [R, A]
    definition: >-
      A date identified by context as a person's birth date.
  demographic_attribute:
    family: attribute
    action: GENERALIZE
    prongs: [A]
    definition: >-
      A non-special-category descriptor of a person used for record linkage: gender, nationality,
      education level, employment status and occupation, language spoken, physical description,
      household and socioeconomic situation.
  device_identifier:
    family: digital
    action: SUPPRESS
    prongs: [R]
    definition: >-
      A persistent identifier of a device or client: MAC address, IMEI, advertising or
      installation ID, user-agent string.
  email:
    family: contact
    action: PSEUDONYM
    prongs: [R, A]
    definition: >-
      An email address.
  government_id:
    family: authority_id
    action: MASK
    prongs: [A]
    definition: >-
      A number an authority issues to identify a person or their entitlement: national ID,
      social-security number, passport, driving licence, tax identifier, professional licence, and
      other state-register numbers.
  gps_coordinates:
    family: location
    action: GENERALIZE
    prongs: [R, A]
    definition: >-
      A latitude/longitude pair or other explicit geocoordinate.
  health_condition:
    family: attribute
    action: SUPPRESS
    prongs: [A]
    definition: >-
      A health fact about a person: diagnosis, symptom, medication, allergy, blood group,
      disability, pregnancy, test or treatment information.
  ip_address:
    family: digital
    action: GENERALIZE
    prongs: [R, A]
    definition: >-
      An IPv4 or IPv6 address.
  locality:
    family: location
    action: GENERALIZE
    prongs: [A]
    definition: >-
      A settlement or sub-state administrative area: city, town, village, district, county,
      borough, or the airport/station code standing for one.
  location:
    family: location
    action: PSEUDONYM
    prongs: [A]
    definition: >-
      A place reference that is neither a postal component nor an administrative rung: named
      buildings, facilities, landmarks, rooms, routes, and unresolved place mentions.
  # Q6 override: separated from `quantity`, which the proposal had merged.
  monetary_amount:
    family: financial
    action: GENERALIZE
    prongs: [A]
    definition: >-
      A numeric amount of money, including cryptocurrency. Any currency, including cryptocurrency,
      makes a numeric amount monetary; the currency unit belongs inside the span. A currency
      designator with no amount is O.
  organization:
    family: organization
    action: PSEUDONYM
    prongs: [R, A]
    definition: >-
      A named company, institution, agency, facility, department, payment network, or card brand.
  payment_card_data:
    family: financial
    action: MASK
    prongs: [A]
    definition: >-
      Payment-card account data: primary account number, security code, or expiry. A named payment
      network or card brand is an organization, not payment_card_data, and remains a separate span
      when adjacent to a primary account number.
  person_name:
    family: person
    action: PSEUDONYM
    prongs: [R, A]
    definition: >-
      Any mention of a natural person by name, including every component (given, family, middle,
      initials) and an adjacent honorific, and including role-marked mentions (patient, clinician,
      relative).
  phone_number:
    family: contact
    action: MASK
    prongs: [R, A]
    definition: >-
      A telephone number in any national convention, including fax and mobile lines.
  postal_code:
    family: location
    action: GENERALIZE
    prongs: [A]
    definition: >-
      A postal or ZIP code.
  protected_attribute:
    family: attribute
    action: SUPPRESS
    prongs: [A]
    definition: >-
      A special-category personal attribute in the GDPR Article 9 sense: racial or ethnic origin,
      religious or philosophical belief, political opinion, trade-union membership, sexual
      orientation.
  # Q6 override: the proposal's definition also covered sums of money and
  # their currency designators; those are now monetary_amount.
  quantity:
    family: other
    action: GENERALIZE
    prongs: [A]
    definition: >-
      A non-currency number-bearing amount or measure that is quasi-identifying in context: areas,
      counts including securities and share counts, percentages, and other measures. A monetary
      amount is monetary_amount, not quantity. A generic elapsed duration ("two years", "30
      minutes") is NOT a quantity: durations, deictic/relative time and dosing schedules are
      outside this de-identification ontology and route to O.
  record_identifier:
    family: org_id
    action: PSEUDONYM
    prongs: [A]
    definition: >-
      A code an organization or system issued that links a person to a record it holds: customer
      and account numbers, medical record numbers, insurance and policy numbers, employee and
      student numbers, membership, order, reservation and case references, vehicle registration
      and VIN, biometric-template references, and opaque codes whose issuing system the document
      does not name.
  street_address:
    family: location
    action: PSEUDONYM
    prongs: [A]
    definition: >-
      The premises line of a postal address: street name with house or building number and any
      unit, suite, floor, or PO box element.
  time:
    family: date_time
    action: KEEP
    prongs: [A]
    definition: >-
      A clock time or time-of-day expression with no date.
  url:
    family: contact
    action: PSEUDONYM
    prongs: [R, A]
    definition: >-
      A web address, URI, or social-profile locator.
  username:
    family: digital
    action: PSEUDONYM
    prongs: [R]
    definition: >-
      An account handle, login name, or screen name.

# Exactly two predicate channels are adopted. A channel value is a list of
# absolute half-open Unicode-codepoint [start, end) intervals lying entirely
# inside the primary span. A nonempty list means known-positive extents, []
# means known negative, and a missing key means unknown: unknown masks both
# loss and evaluation. `attrs` is optional so v1 readers can ignore it.
attr_channels:
  care_provider:
    applicable_types: [person_name]
    semantics_version: 1
    value_kind: character_extents
    definition: >-
      Characters of the name that identify a care provider (clinician, treating professional, or
      other care-giving role holder) rather than a patient, relative, or unrelated person.
  family_name:
    applicable_types: [person_name]
    semantics_version: 1
    value_kind: character_extents
    definition: >-
      Characters of the person_name span that constitute the family name (surname). Multiple
      disjoint intervals are valid for compound or split family names.

# Predicate training/inference contract. Recorded here as metadata; no model
# code in this checkpoint depends on it yet.
#
# Raw logits are per MODEL POSITION, never per decoded primary span: the
# predicate head runs alongside the BIOES head over the same position axis T,
# and span-level attribute extents only exist after decoding. Whether a
# position is a token or a character is a property of the producer, which
# declares it in its own metadata.
predicate_contract:
  objective: independent_masked_bce
  encoding: not_bioes
  token_supervision: existential_over_characters
  token_supervision_rule: >-
    A token is positive for a channel iff it overlaps at least one positive attribute character.
    Character models preserve the exact extents.
  raw_output: bioes_logits_plus_predicate_logits
  raw_output_granularity: model_position
  primary_logit_shape: [B, T, 117]
  predicate_logit_shape: [B, T, K]
  logit_axes: [batch, position, channel]
  position_granularity: declared_by_producer_metadata
  position_granularity_values: [token, character]
  interpreted_output: >-
    Primary spans plus, for each span, per-channel attribute character intervals with confidences.
  evaluation:
    predicate_scope: known_applicable_gold_primary_spans
    missing_gold_key: excluded
    separate_from_span_metrics: true
    primary_span_metrics_use_predicates: false

# Gold dataset metadata contract. A dataset declares the ontology/schema
# version and an attr_channels registry; the loader requires registry
# equality with `attr_channels` above rather than accepting undeclared
# channels.
gold_metadata_contract:
  required_fields: [ontology_version, schema_version, attr_channels]
  registry_match: exact
  registry_fields: [applicable_types, semantics_version, value_kind]
  record_shape: "{id, text, spans, ...}"
  span_shape: "{start, end, type, attrs?}"
  unknown_row_fields: preserved
  span_order: sorted_by_start_end_type
  primary_span_overlap: forbidden
  offsets: absolute_half_open_unicode_codepoints


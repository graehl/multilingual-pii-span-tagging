  # MAPA's global sensitive-entity layer. The retained snapshot also keeps
  # its fine-grained token labels in row metadata; only the complete,
  # non-overlapping global layer is projected into canonical spans.
  mapa_coarse:
    ORGANISATION: organization
    ADDRESS: location
    DATE: date
    PERSON: person_name
    AMOUNT: quantity
    TIME: time

  # idner-news-2k's complete annotation inventory is limited to three
  # conventional named-entity classes. Its outside tokens therefore remain
  # unsupervised when the source is used for privacy training.
  idner_news_2k:
    LOC: location
    ORG: organization
    PER: person_name

  # HiNER's other six entity classes are deliberately absent: festival,
  # game, literature, and misc are not privacy categories; NUMEX is not
  # inherently identifying; and TIMEX mixes absolute with excluded relative
  # time. The onboarding manifest freezes that ignored-label inventory.
  hiner_original:
    LANGUAGE: language_spoken
    LOCATION: location
    ORGANIZATION: organization
    PERSON: person_name
    RELIGION: religious_belief

  # KLUE NER annotates generic Korean news/encyclopedic text at character
  # granularity. DT and TI are deliberately absent because the KLUE guideline
  # tags relative date/time expressions the canonical tagset excludes (the
  # HiNER TIMEX precedent), and QT is generic quantity, not inherently
  # identifying (the HiNER NUMEX precedent; unlike MAPA's sensitive-entity
  # AMOUNT layer). Outside tokens remain unsupervised when the source is
  # used for privacy training.
  klue_ner:
    PS: person_name
    LC: location
    OG: organization

  # Wojood's public repository sample preserves nested BIO tracks. Cardinal,
  # ordinal, percent, quantity, unit, currency, event, law, product, and NORP
  # are deliberately excluded: they are either not inherently private or
  # conflate target attributes that cannot be projected defensibly.
  wojood_nested:
    PERS: person_name
    ORG: organization
    GPE: location
    LOC: location
    FAC: location
    OCC: occupation
    LANGUAGE: language_spoken
    WEBSITE: url
    DATE: date
    TIME: time
    MONEY: monetary_amount

  # AQMAR's corrected OpenNER 1.0 package has the conventional three core
  # named-entity types. Outside tokens stay unsupervised for privacy training
  # because AQMAR does not annotate the full deployment inventory.
  aqmar_core:
    LOC: location
    ORG: organization
    PER: person_name

  # The license-screened OpenNER subset uses the same exhaustive core entity
  # inventory in every constituent corpus. Outside tokens are negative only
  # for these three types, not for the full privacy ontology.
  openner_core:
    LOC: location
    ORG: organization
    PER: person_name

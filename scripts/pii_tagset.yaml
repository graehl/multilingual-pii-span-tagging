# Target PII tagset hierarchy + per-source-schema mapping specs.
# Contract: topics/pii-adaptation.md "Axis 2" (tagset projector).
#
# nodes: target tagset as a forest. Each node:
#   parent: enclosing node (absent = top-level category)
#   coarse: name | format | freetext  -- the MT-routing stratum
#           (inherited from parent when absent)
#   refine: rule family expected to decide this refinement from its parent
#           (R0 generator provenance, R1 surface form, R2 lexicon,
#            R3 span structure, R4 context, R5 cross-model, R6 LLM)
#           -- documentation, not executed config.
# Backoff: a span undecidable among siblings keeps the parent label.
#
# sources: per-schema label -> node maps. Every source label maps to
# exactly one node; coarsening a prediction = walking up from its node to
# the source schema's image (see scripts/pii_projector.py).

version: 1

nodes:
  # ---- person names (coarse: name)
  person_name: {coarse: name}
  given_name: {parent: person_name, refine: R0/R2/R3}
  family_name: {parent: person_name, refine: R0/R2/R3}
  middle_name: {parent: person_name, refine: R0/R3}
  name_prefix: {parent: person_name, refine: R1/R2}   # Mr/Dr titles
  clinician_name: {parent: person_name, refine: R4/R6}

  # ---- person attributes / demographic quasi-identifiers (freetext)
  person_attribute: {coarse: freetext}
  age: {parent: person_attribute, coarse: format}
  gender: {parent: person_attribute}
  physical_trait: {parent: person_attribute}           # eye color, height
  occupation: {parent: person_attribute}
  race_ethnicity: {parent: person_attribute}
  religious_belief: {parent: person_attribute}
  political_view: {parent: person_attribute}
  sexuality: {parent: person_attribute}
  education_level: {parent: person_attribute}
  employment_status: {parent: person_attribute}
  language_spoken: {parent: person_attribute}
  health_attribute: {parent: person_attribute}         # meds, allergies, conditions
  organization: {coarse: freetext}

  # ---- location / address
  location: {coarse: freetext}
  address: {parent: location}
  street_address: {parent: address, refine: R2/R3}
  building_number: {parent: street_address, coarse: format, refine: R1}
  secondary_address: {parent: street_address, refine: R1}  # apt/suite
  city: {parent: location, refine: R2}
  region: {parent: location, refine: R2}               # state/county
  postal_code: {parent: location, coarse: format, refine: R1}
  country: {parent: location, refine: R2}
  gps_coordinates: {parent: location, coarse: format, refine: R1}

  # ---- contact (format)
  contact: {coarse: format}
  email: {parent: contact, refine: R1}
  phone_number: {parent: contact, refine: R1}
  url: {parent: contact, refine: R1}

  # ---- digital identity (format)
  digital_id: {coarse: format}
  username: {parent: digital_id}
  ip_address: {parent: digital_id, refine: R1}
  mac_address: {parent: digital_id, refine: R1}
  device_id: {parent: digital_id, refine: R1}          # IMEI etc.
  user_agent: {parent: digital_id, refine: R1}
  account_id: {parent: digital_id}
  biometric_identifier: {parent: digital_id}

  # ---- government / national IDs (format)
  government_id: {coarse: format}
  national_id: {parent: government_id, refine: R1/R4}  # SSN etc.
  passport_number: {parent: government_id, refine: R1/R4}
  drivers_license: {parent: government_id, refine: R1/R4}
  tax_id: {parent: government_id, refine: R1/R4}
  certificate_license: {parent: government_id, refine: R4}  # professional
  document_code: {parent: government_id, refine: R4}   # case/doc numbers (TAB CODE)

  # ---- organization-issued person identifiers (format)
  org_issued_id: {coarse: format}
  medical_record_number: {parent: org_issued_id, refine: R4}
  insurance_id: {parent: org_issued_id, refine: R4}    # health plan/policy
  employee_id: {parent: org_issued_id, refine: R4}
  customer_id: {parent: org_issued_id, refine: R4}

  # ---- financial (format)
  financial: {coarse: format}
  bank_account: {parent: financial}
  account_number: {parent: bank_account, refine: R1}
  iban: {parent: bank_account, refine: R1}
  routing_code: {parent: bank_account, refine: R1}     # ABA/BIC
  payment_card: {parent: financial}
  card_number: {parent: payment_card, refine: R1}
  card_expiry: {parent: payment_card, refine: R1/R4}
  card_cvv: {parent: payment_card, refine: R1/R4}
  crypto_address: {parent: financial, refine: R1}
  monetary_amount: {parent: financial, coarse: freetext}

  # ---- secrets / credentials (format)
  credential: {coarse: format}
  password: {parent: credential}
  api_key: {parent: credential, refine: R1}
  access_token: {parent: credential, refine: R1}
  pin: {parent: credential, refine: R1/R4}
  recovery_code: {parent: credential}

  # ---- dates / times (format)
  date_time: {coarse: format}
  date: {parent: date_time}
  date_of_birth: {parent: date, refine: R4}
  document_date: {parent: date, refine: R4}
  expiration_date: {parent: date, refine: R4}
  transaction_date: {parent: date, refine: R4}
  time: {parent: date_time}

  # ---- vehicle (format)
  vehicle_id: {coarse: format}
  vin: {parent: vehicle_id, refine: R1}
  vehicle_registration: {parent: vehicle_id, refine: R1}

  # ---- catch-alls
  quantity: {coarse: freetext}                          # TAB QUANTITY
  misc_identifier: {coarse: freetext}                   # TAB MISC

  fax_number: {parent: phone_number, refine: R4}      # context-only vs voice
  ssn: {parent: national_id, refine: R1}
  masked_number: {parent: account_number, refine: R1}  # already-redacted digits
  swift_bic: {parent: routing_code, refine: R1}
  aba_routing: {parent: routing_code, refine: R1}
  ipv4: {parent: ip_address, refine: R1}
  ipv6: {parent: ip_address, refine: R1}
  bitcoin_address: {parent: crypto_address, refine: R1}
  ethereum_address: {parent: crypto_address, refine: R1}
  litecoin_address: {parent: crypto_address, refine: R1}
  currency_designator: {parent: financial, coarse: format}  # $, USD, "dollars"
  salary: {parent: monetary_amount}                    # income = sensitive amount
  allergy: {parent: health_attribute}
  medication: {parent: health_attribute}
  medical_condition: {parent: health_attribute}
  blood_type: {parent: health_attribute}
  eye_color: {parent: physical_trait}
  height: {parent: physical_trait}
  weight: {parent: physical_trait}
  state: {parent: region}
  county: {parent: region}
  job_title: {parent: occupation}
  job_area: {parent: occupation}
  healthcare_org: {parent: organization}
  financial_org: {parent: organization}
  org_department: {parent: organization}
  airport_code: {parent: location, coarse: format}
  timezone: {parent: location, coarse: format}

  patient_name: {parent: person_name, refine: R4/R6}
  relative_name: {parent: person_name, refine: R4/R6}
  circumstance: {parent: person_attribute}             # identifying events
  lifestyle: {parent: person_attribute}                # hobbies etc.
  socioeconomic_status: {parent: person_attribute}


training_mix:
  apply_after_per_language_tag_floors: true
  # 1% per language across all 35, by user preference (2026-09-11); 35 at 1%
  # leaves 65% of the mix free, so this constrains starvation and nothing else.
  # No language should be effectively absent from the objective whatever
  # weighting the reported bottom line uses.
  #
  # Until the data exists to meet this honestly it is enacted through sampler
  # pool weights, which repeat existing rows rather than adding new ones. The
  # floor is therefore also a statement of where annotation is most needed:
  # 23 of 35 languages were below it on 2026-09-11, the worst at 0.62%.
  # User-authorized branch mixture allows language drift without rebalancing.
  # The base 1% guarantee contributes at least 0.75% at the largest gold dose.
  minimum_core_language_share: 0.0075
